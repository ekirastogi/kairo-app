<button
  type="button"
  [class]="buttonClass()"
  [class.plan-tool-btn-on]="open()"
  [disabled]="busy() || !candidates().length"
  (click)="toggleOpen()"
>
  <span class="inline-flex items-center gap-1.5">
    <svg class="h-3.5 w-3.5" [class.animate-spin]="busy()" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path fill-rule="evenodd" d="M15.312 11.424a5.5 5.5 0 01-9.201 2.466l-.312-.311h2.433a.75.75 0 000-1.5H3.989a.75.75 0 00-.75.75v4.242a.75.75 0 001.5 0v-2.43l.31.31a7 7 0 0011.712-3.138.75.75 0 00-1.449-.39zm1.23-3.723a.75.75 0 00.219-.53V2.929a.75.75 0 00-1.5 0V5.36l-.31-.31a7 7 0 00-11.712 3.138.75.75 0 101.45.388A5.5 5.5 0 0113.89 6.11l.311.31h-2.432a.75.75 0 000 1.5h4.243a.75.75 0 00.53-.219z" clip-rule="evenodd" />
    </svg>
    {{ busy() ? 'Refreshing…' : label() }}
  </span>
</button>

@if (open()) {
  <section class="plan-refresh absolute right-0 top-full z-30 mt-2 w-[min(22rem,calc(100vw-2rem))] shadow-elevated">
    <header class="plan-refresh-head">
      <h2>Refresh CMP</h2>
      <button type="button" class="plan-link" (click)="open.set(false)">Close</button>
    </header>
    <div class="plan-refresh-actions">
      <button type="button" class="plan-refresh-chip" [class.plan-refresh-chip-on]="preset() === 'all'" (click)="selectAll()">Select all</button>
      <button type="button" class="plan-refresh-chip" [class.plan-refresh-chip-on]="preset() === 'none'" (click)="selectNone()">Deselect all</button>
      @for (window of windows; track window.id) {
        <button
          type="button"
          class="plan-refresh-chip"
          [class.plan-refresh-chip-on]="preset() === window.id"
          (click)="selectOlderThan(window.ms, window.id)"
        >Older than {{ window.label }}</button>
      }
    </div>
    <ul class="plan-refresh-list">
      @for (stock of candidates(); track stock.symbol) {
        <li>
          <label class="plan-refresh-row">
            <input type="checkbox" [checked]="isSelected(stock.symbol)" (change)="toggleSymbol(stock.symbol)" />
            <span class="sym">{{ stock.symbol }}</span>
            <span class="name">{{ stock.name }}</span>
            <span class="age">{{ stock.ageLabel }}</span>
          </label>
        </li>
      } @empty {
        <li class="plan-refresh-empty">No stocks to refresh.</li>
      }
    </ul>
    <footer class="plan-refresh-foot">
      <button
        type="button"
        class="plan-tool-btn plan-tool-btn-primary"
        [disabled]="busy() || !selection().length"
        (click)="confirm()"
      >
        Refresh {{ selection().length || '' }}
      </button>
      <button type="button" class="plan-link" (click)="open.set(false)">Cancel</button>
    </footer>
  </section>
}
